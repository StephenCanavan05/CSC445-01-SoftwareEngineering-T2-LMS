{% extends 'base.html' %}

{% block content %}
<div class="card border-0 shadow-sm mb-4 mt-4">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0">Customer Directory</h4>
        <!-- SEARCH CUSTOMERS -->
        <form method="GET" action="{% url 'customer_directory' %}" class="d-flex w-50">
            <input type="text" name="user_q" class="form-control form-control-sm me-2"
                placeholder="Search by username or email..." value="{{ request.GET.user_q }}">
            <button type="submit" class="btn btn-sm btn-outline-light">Search</button>
        </form>
    </div>
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for patron in all_patrons %}
                <tr>
                    <td class="align-middle fw-bold">{{ patron.username }}</td>
                    <td class="align-middle">{{ patron.email }}</td>
                    <td class="align-middle">
                        <span class="badge {% if patron.is_active %}bg-success{% else %}bg-secondary{% endif %}">
                            {{ patron.is_active|yesno:"Active,Inactive" }}
                        </span>
                    </td>
                    <td class="text-end">
                        <a href="{% url 'patron_detail' patron.pk %}" class="btn btn-sm btn-primary">Manage Account</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center text-muted py-4">No users found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
